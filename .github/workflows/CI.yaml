name: CI

on:
  push:
    branches:
      - "master"
      - "project01-bh"
  pull_request:
    branches:
      - "master"
      - "project01-bh"
  # schedule:
  #   # Nightly Tests
  #   - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # , macOS-latest, windows-latest]
    env:
      CI_OS: ${{ matrix.os }}
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group test

      - name: Run tests (pytest)
        shell: bash
        run: |
          uv run --no-sync pytest -v --cov=$PACKAGE --cov-report=xml --color=yes $PACKAGE/

      - name: CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests

  lint-format:
    runs-on: ubuntu-latest
    env:
      CI_OS: ubuntu-latest
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Install lint tools
        run: uv sync --locked --only-group lint --no-install-project

      - name: Run flake8
        run: uv run --no-sync flake8 $PACKAGE/

      - name: Run black check
        if: always()
        run: uv run --no-sync black --check $PACKAGE/
