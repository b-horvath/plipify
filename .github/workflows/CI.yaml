name: CI

on:
  push:
    branches:
      - "master"
      - "project01-bh"
  pull_request:
    branches:
      - "master"
      - "project01-bh"
  # schedule:
  #   # Nightly Tests
  #   - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # , macOS-latest, windows-latest]
    env:
      CI_OS: ${{ matrix.os }}
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          environments: plipify
          locked: true
          cache: true

      - name: Run tests (pytest)
        shell: bash
        run: |
          pixi run -e plipify pytest -v --cov=$PACKAGE --cov-report=xml --color=yes --doctest-modules $PACKAGE/

      - name: CodeCov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests

  lint-format:
    runs-on: ubuntu-latest
    env:
      CI_OS: ubuntu-latest
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v1

      - uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Setup packages
        shell: bash
        run: |
          python -m pip install flake8 black

      - name: Run flake8
        shell: bash
        run: |
          flake8 $PACKAGE/

      - name: Run black check
        shell: bash
        if: always()
        run: |
          black --check -l 99 $PACKAGE/ --exclude=$PACKAGE/_version.py
